<header class="topbar">

    </div>
  </div>
</header>
<main>
<section class="k1head">
  <div class="wrap">
    <div class="k1title"><h1>Otso <span>1 km</span></h1><span class="pill pill-beta" data-k="beta">beta</span></div>
    <p class="status" id="status">…</p>
    <div class="searchrow">
      <div class="sbox"><input type="search" id="q" autocomplete="off" placeholder="Search a city…" aria-label="Search a city" /><ul class="slist" id="qlist" hidden></ul></div>
      <button type="button" class="geo" id="geo" aria-label="My location">📍<span class="full" data-k="geo"> My location</span></button>
    </div>
  </div>
</section>
<section>
  <div class="wrap">
    <div class="mapcard">
      <div class="k1bar">
        <div class="seg" id="prod"><button type="button" data-p="mean" class="on" data-k="mean">PM2.5, daily mean</button><button type="button" data-p="prob15" data-k="prob">Probability &gt; 15</button></div>
        <div class="seg" id="days"></div>
        <label class="opac"><span data-k="opacity">Opacity</span><input type="range" id="op" min="0.2" max="1" step="0.05" value="0.7" /></label>

      <div class="k1map" id="map"><div class="badge" id="badge"></div><div class="note" id="note">…</div></div>
      <div class="legend" id="legend"></div>
      <p class="modelline"><span id="modelline"></span> <span class="long" id="caveat"></span></p>
    </div>
    <div class="disclaimer"><strong id="disc-title">Research forecast.</strong> <span id="disc-text"></span></div>
  </div>
</section>
<section class="band band-soft" id="about" style="margin-top:30px">
  <div class="wrap">
    <h2 data-k="about_h2">About this map</h2>
    <div class="twocol">
      <div><h3 data-k="about_what">What it shows</h3><ul id="about-what"></ul></div>
      <div><h3 data-k="about_not">What it is not</h3><ul id="about-not"></ul></div>
    </div>
    <p class="small" id="about-data"></p>
  </div>
</section>
</main>

</div></footer>

    } catch (e) { html += `<div class="rs">${esc(k("failed"))}</div>`; }
    if (!S.popup) S.popup = new maplibregl.Popup({ closeOnClick: false, maxWidth: "260px" }).on("close", () => { S.last = null; });
    S.popup.setLngLat([lng, lat]).setHTML(html); if (!S.popup.isOpen()) S.popup.addTo(S.map);
    if (fly) S.map.flyTo({ center: [lng, lat], zoom: Math.max(S.map.getZoom(), 10), speed: 1.6 });
  }

  // ---------------------------------------------------------------- search (GeoNames gazetteer of the site) and position
  let GAZ = null; const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  async function gaz() { if (!GAZ) { const j = await (await fetch("../gazetteer.json")).json(); GAZ = j.map((r) => ({ name: r[0], country: r[1], lat: r[2], lon: r[3], pop: r[4], n: norm(r[0]) })); } return GAZ; }
  const q = $("q"), ql = $("qlist"); let hits = [], hsel = -1;
  function showHits() { ql.innerHTML = hits.length ? hits.map((h, i) => `<li data-i="${i}" class="${i === hsel ? "sel" : ""}">${esc(h.name)}<span>${esc(h.country)}</span></li>`).join("") : `<li>${esc(k("nores"))}</li>`; ql.hidden = !q.value.trim(); }
  q.addEventListener("focus", () => { gaz().catch(() => {}); });
  q.addEventListener("input", async () => { const s = norm(q.value.trim()); if (s.length < 2) { ql.hidden = true; return; } const g = await gaz(); hits = g.filter((r) => r.n.startsWith(s)).slice(0, 8); if (hits.length < 8) hits = hits.concat(g.filter((r) => !r.n.startsWith(s) && r.n.includes(s)).slice(0, 8 - hits.length)); hsel = hits.length ? 0 : -1; showHits(); });
  q.addEventListener("keydown", (ev) => { if (ql.hidden) return; if (ev.key === "ArrowDown") { hsel = Math.min(hits.length - 1, hsel + 1); showHits(); ev.preventDefault(); } else if (ev.key === "ArrowUp") { hsel = Math.max(0, hsel - 1); showHits(); ev.preventDefault(); } else if (ev.key === "Enter" && hsel >= 0) { choose(hits[hsel]); ev.preventDefault(); } else if (ev.key === "Escape") ql.hidden = true; });
  ql.addEventListener("click", (ev) => { const li = ev.target.closest("li[data-i]"); if (li) choose(hits[+li.dataset.i]); });
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".sbox")) ql.hidden = true; });
  function choose(h) { ql.hidden = true; q.value = h.name + ", " + h.country; ls.set("otso-city", JSON.stringify({ name: q.value, lat: h.lat, lon: h.lon })); goTo(h.lng ?? h.lon, h.lat, 10); }
  function goTo(lng, lat, z) { if (!S.map) return; S.map.jumpTo({ center: [lng, lat], zoom: z }); readout(lng, lat, false); }
  $("geo").addEventListener("click", () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((p) => { ls.set("otso-geo", "1"); goTo(p.coords.longitude, p.coords.latitude, 11); }, () => {}, { timeout: 10000, maximumAge: 600000 });
  });
  let urlT = null;
  function syncUrl() { clearTimeout(urlT); urlT = setTimeout(() => { if (!S.map) return; const c = S.map.getCenter(), u = new URL(location.href);
    u.searchParams.set("lat", c.lat.toFixed(4)); u.searchParams.set("lon", c.lng.toFixed(4)); u.searchParams.set("z", S.map.getZoom().toFixed(1)); u.searchParams.set("day", S.lead); if (S.prod !== "mean") u.searchParams.set("p", S.prod); else u.searchParams.delete("p");
    history.replaceState(null, "", u.pathname + u.search + u.hash); }, 400); }

  // ---------------------------------------------------------------- start
  async function start() {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});
    await setLang(detectLang(), false);
    $("note").textContent = k("loading");
    for (let tries = 0; ; tries++) {                                                      // the layer may not be online yet: retry every minute
      try {
        const r = await fetch(BASE + "latest.json", { cache: "no-cache" }); if (!r.ok) throw new Error("latest " + r.status);
        S.latest = await r.json();
        const r2 = await fetch(BASE + S.latest.tiles_json, { cache: "no-cache" }); if (!r2.ok) throw new Error("tiles.json " + r2.status);
        S.meta = await r2.json(); break;
      } catch (e) {
        const d = (S.latest && S.latest.latest) || new Date().toISOString().slice(0, 10);
        $("note").textContent = k("pending", { date: dfmt(d, { day: "numeric", month: "long", year: "numeric" }) });
        $("status").textContent = k("pending", { date: dfmt(d, { day: "numeric", month: "long", year: "numeric" }) });
        if (tries >= 60) return;
        await new Promise((res) => setTimeout(res, 60000));
      }
    }
    $("note").textContent = k("loading");
    for (const [p, zz] of Object.entries(S.meta.tiles)) { bits[p] = {}; for (const [z, b64] of Object.entries(zz)) bits[p][z] = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); }
    buildLut();
    const today = new Date().toISOString().slice(0, 10), L0 = S.meta.leads.find((x) => S.meta.layers.mean[x].valid === today);
    S.lead = +(P.get("day") || L0 || S.meta.leads[0]); if (!S.meta.leads.includes(S.lead)) S.lead = S.meta.leads[0];
    if (P.get("p") === "prob15") { S.prod = "prob15"; for (const x of $("prod").children) x.classList.toggle("on", x.dataset.p === "prob15"); }
    status(); days(); legend();
    const gl = (() => { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { return false; } })();
    if (!gl) { $("note").textContent = k("nogl"); return; }
    let center = [10, 48], zoom = 3.6, pick = null;
    const plat = parseFloat(P.get("lat")), plon = parseFloat(P.get("lon"));
    if (isFinite(plat) && isFinite(plon)) { center = [plon, plat]; zoom = parseFloat(P.get("z")) || 10; if (P.get("pin") === "1") pick = center; }
    else { let rem = null; try { rem = JSON.parse(ls.get("otso-city") || "null"); } catch (e) {} if (rem && isFinite(rem.lat)) { center = [rem.lon, rem.lat]; zoom = 9.5; pick = center; q.value = rem.name || ""; } }
    const map = new maplibregl.Map({ container: "map", style: styleUrl(), center, zoom, minZoom: 1, maxZoom: 17.5, attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false, cooperativeGestures: false });
    S.map = map; map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 100 }), "bottom-left");
    map.on("style.load", () => { S.styleReady = true; addLayers(); $("note").hidden = true; });
    map.on("click", (ev) => readout(ev.lngLat.lng, ev.lngLat.lat, false));
    map.on("moveend", syncUrl);
    map.on("error", (ev) => { if (ev && ev.error && /style/i.test(String(ev.error.message))) $("note").textContent = k("failed"); });
    if (pick) map.once("idle", () => readout(pick[0], pick[1], false));
  }
  start();
})();
</script>
</body>
